# /etc/nut/pve-nut.conf: sourced by the pve-nut-* scripts as bash, so no spaces around `=`. No secrets.
# The node that owns the UPS on USB runs upsd and is the `server`; every other node is a `client`.

NUT_ROLE=server
# ups@host as upsc takes it: 127.0.0.1 on the server, the server's address on a client.
UPS_SYS=ups@127.0.0.1

# Guests stopped last in the final wave, one by one after every other guest is down: a router VM
# routes for the rest. Each node holds back only the ones it hosts. The lowest id goes last.
EDGE_VMIDS="101 102"

# Tier 1, at ONBATT + the upssched timer: the guests to shed early, wherever they run.
SHED_VMIDS="201 204 209"
# 1 halts this node after its shed (the final wave runs right away). Its WoL MACs must be in the
# server's WOL_TARGETS, or nothing powers it back on.
SHED_HALT_NODE=0

# ── server only ──────────────────────────────────────────────────────────
# Step 4b: the halt waits until NAS_HOST stops answering on NAS_PORTS and PEER_HOSTS stop
# answering ping, at most KILLPOWER_WAIT s. Empty NAS_HOST and PEER_HOSTS skip the wait.
NAS_HOST=192.0.2.10
NAS_PORTS="445 2049"
PEER_HOSTS="192.0.2.12 192.0.2.13"
KILLPOWER_WAIT=180

# Restore: magic packets on WOL_IFACE to every `mac=address` whose address does not answer ping.
WOL_IFACE=vmbr0
WOL_TARGETS="aa:bb:cc:dd:ee:03=192.0.2.13"
