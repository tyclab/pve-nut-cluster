# /etc/nut/upssched.conf. Each event cancels the other's timer: a flap shorter than the delay does
# nothing. LOWBATT and FSD cancel the shed: the final wave is under way and owns the guests. The
# CMDSCRIPT (as nut) only drops a request for pve-nut-tier.path.
CMDSCRIPT /usr/local/bin/pve-nut-upssched-cmd.sh
PIPEFN /run/nut/upssched/upssched.pipe
LOCKFN /run/nut/upssched/upssched.lock

AT ONBATT * START-TIMER shed 120
AT ONLINE * CANCEL-TIMER shed
AT LOWBATT * CANCEL-TIMER shed
AT FSD * CANCEL-TIMER shed
AT ONLINE * START-TIMER restore 180
AT ONBATT * CANCEL-TIMER restore
