# /etc/nut/upsmon.conf. The server monitors 127.0.0.1 as primary; a client monitors the server
# as secondary:
#   MONITOR ups@192.0.2.11 1 pvesecondary "change-me-secondary" secondary
MONITOR ups@127.0.0.1 1 pveprimary "change-me-primary" primary
SHUTDOWNCMD "/usr/local/bin/pve-nut-shutdown.sh"

MINSUPPLIES 1
POLLFREQ 5
POLLFREQALERT 5
HOSTSYNC 15
DEADTIME 15
POWERDOWNFLAG /etc/killpower
FINALDELAY 5

# upssched sees only EXEC-flagged events: every event upssched.conf names needs EXEC here.
NOTIFYCMD /usr/sbin/upssched
NOTIFYFLAG ONBATT   SYSLOG+EXEC
NOTIFYFLAG ONLINE   SYSLOG+EXEC
NOTIFYFLAG LOWBATT  SYSLOG+WALL+EXEC
NOTIFYFLAG FSD      SYSLOG+WALL+EXEC
NOTIFYFLAG SHUTDOWN SYSLOG+WALL
NOTIFYFLAG REPLBATT SYSLOG
NOTIFYFLAG NOCOMM   SYSLOG+WALL
