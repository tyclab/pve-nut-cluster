# /etc/nut/ups.conf on the server.
maxretry = 3

[ups]
driver = usbhid-ups
port = auto
# LB from these thresholds instead of the UPS's own (ups.conf(5) ignorelb). The final wave needs
# about 395 s on the primary plus the halt: runtime.low 600 s leaves room. Size it to your load.
ignorelb
override.battery.charge.low = 20
override.battery.runtime.low = 600
